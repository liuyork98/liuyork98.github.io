<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>線上留言板</title>
	<link rel="stylesheet" href="/doct/tip.tr4cdn.cdn.hinet.net/tra-tip-web/static/css/bootstrap.min.css">
	<link rel="stylesheet" href="/doct/tip.tr4cdn.cdn.hinet.net/tra-tip-web/static/css/font-awesome.min.css">
	<link rel="stylesheet" href="/doct/tip.tr4cdn.cdn.hinet.net/tra-tip-web/static/css/tip_normal.css">
	<link rel="stylesheet" href="/doct/tip.tr4cdn.cdn.hinet.net/tra-tip-web/static/css/tip_default.css">
	<link rel="stylesheet" href="/doct/tip.tr4cdn.cdn.hinet.net/tra-tip-web/static/css/tip_station_map.css">
	<link rel="stylesheet" href="/doct/tip.tr4cdn.cdn.hinet.net/tra-tip-web/static/css/jquery-ui.min.css">
	<link rel="stylesheet" href="/doct/tip.tr4cdn.cdn.hinet.net/tra-tip-web/static/css/bootstrap-datepicker.css">
	<link rel="stylesheet" href="/doct/tip.tr4cdn.cdn.hinet.net/tra-tip-web/static/css/bootstrap-datepicker.standalone.css">
	<link rel="stylesheet" href="/doct/tip.tr4cdn.cdn.hinet.net/tra-tip-web/static/css/jquery-ui.autocomplete.css">
	<link rel="stylesheet" href="/doct/tip.tr4cdn.cdn.hinet.net/tra-tip-web/static/css/marquee.css">

    <style>
        body { 
            font-family: sans-serif; 
            max-width: 500px; 
            margin: 2rem auto; 
			margin-top: 20px;
        }
        .form-group { 
            margin-bottom: 1rem; 
        }
        input, textarea { 
            width: 100%; 
            padding: 8px; 
            margin-top: 5px; 
        }
        button { 
            padding: 10px 20px; 
            cursor: pointer; 
        }
		.detail {
			width: 585px;
    		height: 500px;
    		border: none;
			margin: 10px 0 0 0;
		}
		.goback {
    width: 87.19px;
		}
    </style>
    <!-- 引入 reCAPTCHA API -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>
<div class="goback">
        <button onclick="history.back()">回上頁</button>
            

</div>
    <h2>留言板Beta</h2>
    
    <form id="messageForm">
        <div class="form-group">
            <label for="name">名稱：</label>
            <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
            <label for="message">訊息：</label>
            <textarea id="message" name="message" rows="4" required></textarea>
        </div>
        
        <!-- reCAPTCHA v2 區塊 -->
        <div class="form-group">
            <div class="g-recaptcha" data-sitekey="6LcLaoItAAAAAE8IWkWrDr0RiC_WKgZfiTB4Ms5V"></div>
        </div>

        <button type="submit" id="submitBtn">送出留言</button>
    </form>
	
	<iframe class="detail" src="https://docs.google.com/spreadsheets/d/e/2PACX-1vRf19r1rgdm3FNpJbmyUCpVynSpfkeNhEh2sHmqwXL1lUl7hNpZ2_iLTAx5bAN225inZbpvwtUQ4hMC/pubhtml?gid=0&amp;single=true&amp;widget=true&amp;headers=false"></iframe>
    
	<script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwf42mEgPHMYUxtkZAsPsfB0iKIUGRDBDX0lab8xxuLsPBc8SH6FM5gihggwy-VrbIdqw/exec';
        const form = document.getElementById('messageForm');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', e => {
            e.preventDefault(); 
            
            // 檢查是否已通過 reCAPTCHA 驗證
            const recaptchaResponse = grecaptcha.getResponse();
            if (recaptchaResponse.length === 0) {
                // 若未勾選，直接中斷函式不送出
                return; 
            }

            submitBtn.innerText = '傳送中...';
            submitBtn.disabled = true;

            let formData = new FormData(form);

            fetch(scriptURL, { 
                method: 'POST', 
                body: formData 
            })
            .then(response => {
                alert('留言已成功送出！');
                form.reset(); 
                grecaptcha.reset(); // 送出成功後重置 reCAPTCHA
                submitBtn.innerText = '送出留言';
                submitBtn.disabled = false;
            })
            .catch(error => {
                console.error('Error!', error.message);
                alert('送出失敗，請稍後再試。');
                grecaptcha.reset(); // 失敗也重置
                submitBtn.innerText = '送出留言';
                submitBtn.disabled = false;
            });
        });
    </script>
<!------------------------------------------Webkit按鈕相容程式區段------------------------------------------->
        	 <div style="display:none;">
            <div>
              <div style="height: 179px;width: 494px;top: 19px; position: relative;">
                <form>
                  <textarea type="text" id="text1" style="width:400px;height: 50px;" value=""></textarea>
                  <input type="reset" value="清除" />
                </form>
                <button type="button" id="btn1" class="btn btn-basic btn-lg g-recaptcha"
                  data-sitekey="6Lc7YoUoAAAAADBikFoOMUOacYD1Ls0usr9Xf_vZ" data-callback="onSubmit">複製</button>
                
              </div>
<div style="height: 179px;width: 494px;top: 19px; position: relative;">
                <form>
                  <textarea type="text" id="text2" style="width:400px;height: 50px;" value=""></textarea>
                  <input type="reset" value="清除" />
                </form>
                <button type="button" id="btn2" class="btn btn-basic btn-lg g-recaptcha"
                  data-sitekey="6Lc7YoUoAAAAADBikFoOMUOacYD1Ls0usr9Xf_vZ" data-callback="onSubmit">複製</button>
                
              </div>
              <script>
                const select = (DOM) => document.querySelector(DOM);

                select('#btn1').addEventListener('click', () => {
                  select('#text1').select();
                  document.execCommand("copy");
                })
				select('#btn2').addEventListener('click', () => {
                  select('#text2').select();
                  document.execCommand("copy");
                })
                select('#textarea-btn').addEventListener('click', () => {
                  select('#textarea').select();
                  document.execCommand("copy");
                })
              </script>

              
            </div>
            
          </div>
<!------------------------------------------Webkit按鈕相容程式區段-End------------------------------------------>
</body>
</html>

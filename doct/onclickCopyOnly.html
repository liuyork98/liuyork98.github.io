            <div class="g-recaptchaForm">
              <div class="g-recaptcha" data-sitekey="6Ldo720sAAAAAKhcM4EJuExhoAO8WpR_0Os0DWFB"
                data-callback="onRecaptchaVerify"></div>
              <button id="myButton" style="position:relative;top:50px;" disabled>提交</button>
              <script>
                // 將 "YOUR_RECAPTCHA_SITE_KEY" 替換為您的 reCAPTCHA 網站金鑰

                const submitButton = document.getElementById("myButton");
                let recaptchaScore = 0.0;  // 驗證分數的初始值

                // 回調函數，當 reCAPTCHA 驗證成功時被調用
                function onRecaptchaVerify(response) {
                  if (response) {
                    // 從 reCAPTCHA 響應中獲取驗證分數
                    recaptchaScore = grecaptcha.getResponse();

                    // 根據驗證分數來啟用或禁用按鈕
                    if (recaptchaScore >= 0.5) {  // 此處 0.5 是一個示例閾值
                      submitButton.disabled = false;
                    } else {
                      submitButton.disabled = true;
                    }
                  } else {
                    recaptchaScore = 0.0;
                    submitButton.disabled = true;
                  }
                }
              </script>
